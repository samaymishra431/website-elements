<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Features Section Example</title>

  <!-- Bootstrap CSS (for grid system and utilities) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #dc3545; /* Bootstrap red */
      --secondary-bg: #1a1a1a;
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
    }

    body {
      background-color: #121212;
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
    }

    /* ===== FEATURE SECTION ===== */
.features-section {
    background-color: #242424;
    color: var(--text-color);
  }

  .feature-card {
    background-color: #242424;
    border: 1px solid rgb(255 255 255 / 10%);
    border-radius: 12px;
    padding: 24px;
    transition: all 0.3s ease;
  }

  .feature-card:hover {
    border-color: var(--primary-color);
    box-shadow: 0 0 20px rgba(220, 53, 69, 0.15);
    transform: translateY(-5px);
  }

  .icon-box {
    width: 50px;
    height: 50px;
    background-color: var(--secondary-bg);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    transition: background-color 0.3s ease;
  }

  .feature-card:hover .icon-box {
    background-color: rgba(220, 53, 69, 0.2);
  }

  .icon-box svg {
    color: var(--primary-color);
  }

  .feature-card h3 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text-color);
  }

  .feature-card p {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  /* Center align icon & text on mobile */
  @media (max-width: 576px) {
    .feature-card {
      text-align: center;
    }

    .icon-row {
      justify-content: center !important;
    }
  }
  </style>
</head>

<body>
  <!-- ======== FEATURES SECTION START ======== -->
<section class="features-section py-5">
  <div class="container">
    <div class="row g-4">
      <!-- Feature 1 -->
      <div class="col-6 col-lg-3 d-flex">
        <div class="feature-card d-flex flex-column w-100 h-100 text-center-mobile">
          <div class="icon-row d-flex justify-content-center-mobile">
            <div class="icon-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield">
                <path
                  d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z">
                </path>
              </svg>
            </div>
          </div>
          <div class="feature-content mt-3">
            <h3>Extended Warranty</h3>
            <p>Comprehensive coverage for your peace of mind.</p>
          </div>
        </div>
      </div>

      <!-- Feature 2 -->
      <div class="col-6 col-lg-3 d-flex">
        <div class="feature-card d-flex flex-column w-100 h-100 text-center-mobile">
          <div class="icon-row d-flex justify-content-center-mobile">
            <div class="icon-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wrench">
                <path
                  d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z">
                </path>
              </svg>
            </div>
          </div>
          <div class="feature-content mt-3">
            <h3>Professional Service</h3>
            <p>Expert maintenance and repairs.</p>
          </div>
        </div>
      </div>

      <!-- Feature 3 -->
      <div class="col-6 col-lg-3 d-flex">
        <div class="feature-card d-flex flex-column w-100 h-100 text-center-mobile">
          <div class="icon-row d-flex justify-content-center-mobile">
            <div class="icon-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card">
                <rect width="20" height="14" x="2" y="5" rx="2"></rect>
                <line x1="2" x2="22" y1="10" y2="10"></line>
              </svg>
            </div>
          </div>
          <div class="feature-content mt-3">
            <h3>Flexible Financing</h3>
            <p>Custom payment plans to fit your budget.</p>
          </div>
        </div>
      </div>

      <!-- Feature 4 -->
      <div class="col-6 col-lg-3 d-flex">
        <div class="feature-card d-flex flex-column w-100 h-100 text-center-mobile">
          <div class="icon-row d-flex justify-content-center-mobile">
            <div class="icon-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star">
                <path
                  d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z">
                </path>
              </svg>
            </div>
          </div>
          <div class="feature-content mt-3">
            <h3>Trade-In Program</h3>
            <p>Get the best value for your current vehicle.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- ======== FEATURES SECTION END ======== -->

  <!-- Bootstrap JS (optional for interactive elements) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
